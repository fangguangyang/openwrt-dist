name: Packages

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty uses OPENWRT_VERSION, then latest)'
        default: ''
  workflow_call:
    inputs:
      matrix:
        description: 'Resolved SDK/ImageBuilder metadata from the firmware workflow'
        required: true
        type: string
    secrets:
      TOKEN:
        required: true
      APK_SIGNING_KEY:
        required: false
      OPKG_SIGNING_KEY:
        required: false
    outputs:
      repositories:
        description: 'JSON mapping device IDs to fixed GitHub Release feed URLs'
        value: ${{ jobs.results.outputs.repositories }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fangguangyang/openwrt-dist
          ref: master
      - name: Check software partition and repository validation
        run: python3 -m unittest discover -s tests -v
      - name: Resolve SDKs and software groups
        id: matrix
        env:
          MATRIX_JSON: ${{ inputs.matrix }}
          OPENWRT_VERSION: ${{ inputs.version || vars.OPENWRT_VERSION || 'latest' }}
          DISTRO: ${{ vars.OPENWRT_DISTRO || 'immortalwrt' }}
          DEVICES: ${{ vars.OPENWRT_DEVICES || 'amd64,m28c' }}
        run: |
          if [ -n "$MATRIX_JSON" ]; then
            printf '%s\n' "$MATRIX_JSON" > release.json
          else
            python3 scripts/release.py resolve --distro "$DISTRO" --devices "$DEVICES" --output release.json
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = {'include': json.loads(Path('release.json').read_text())['include']}
          groups = json.loads(Path('package-groups.json').read_text())
          builds = {'include': [dict(target, group=group) for target in targets['include'] for group in groups]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(targets, separators=(',', ':')) + '\n')
              output.write('builds=' + json.dumps(builds, separators=(',', ':')) + '\n')
          PY

      - name: Check persistent signing keys before compiling
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: python3 scripts/signing-key.py check release.json

  sdk:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fangguangyang/openwrt-dist
          ref: master
      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build flex bison g++ gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev zstd file wget
      - name: Cache official SDK archive
        uses: actions/cache@v4
        with:
          path: .build/${{ matrix.id }}/downloads
          key: sdk-archive-${{ matrix.sdk.sha256 }}
      - name: Prepare one SDK and feed snapshot per architecture
        env:
          BUILD_METADATA: ${{ toJSON(matrix) }}
          DEVICE: ${{ matrix.id }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/build.json"
          bash scripts/prepare-sdk.sh "$RUNNER_TEMP/build.json"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/sdk-$DEVICE.tar.zst" -C ".build/$DEVICE" sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.id }}
          path: ${{ runner.temp }}/sdk-${{ matrix.id }}.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Share source lock with prebuilt package jobs
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.id }}
          path: .build/${{ matrix.id }}/sdk/sources.json
          retention-days: 1

  build:
    name: ${{ matrix.id }} / ${{ matrix.group }}
    needs: [prepare, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.BUILD_MAX_PARALLEL || '12') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - name: Free disk space for Go and Rust builds
        if: ${{ matrix.group != 'openclash' && matrix.group != 'passwall' }}
        uses: jlumbroso/free-disk-space@main
        with:
          large-packages: false
      - uses: actions/checkout@v4
        with:
          repository: fangguangyang/openwrt-dist
          ref: master
      - name: Install build dependencies
        if: ${{ matrix.group != 'openclash' && matrix.group != 'passwall' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build flex bison g++ gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev zstd file wget
      - uses: actions/download-artifact@v4
        if: ${{ matrix.group != 'openclash' && matrix.group != 'passwall' }}
        with:
          name: sdk-${{ matrix.id }}
          path: ${{ runner.temp }}/sdk
      - name: Restore prepared SDK
        if: ${{ matrix.group != 'openclash' && matrix.group != 'passwall' }}
        env:
          DEVICE: ${{ matrix.id }}
        run: |
          mkdir -p ".build/$DEVICE"
          tar -xf "$RUNNER_TEMP/sdk/sdk-$DEVICE.tar.zst" -C ".build/$DEVICE"
      - name: Download source lock for prebuilt packages
        if: ${{ matrix.group == 'openclash' || matrix.group == 'passwall' }}
        uses: actions/download-artifact@v4
        with:
          name: sources-${{ matrix.id }}
          path: .build/${{ matrix.id }}/sdk
      - name: Install prebuilt package download dependencies
        if: ${{ matrix.group == 'openclash' || matrix.group == 'passwall' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zstd
      - name: Cache official ImageBuilder for prebuilt packages
        if: ${{ matrix.group == 'openclash' || matrix.group == 'passwall' }}
        uses: actions/cache@v4
        with:
          path: .build/${{ matrix.id }}/downloads
          key: prebuilt-imagebuilder-${{ matrix.imagebuilder.sha256 }}
      - name: Cache downloads and compiled host toolchains
        if: ${{ matrix.group != 'openclash' && matrix.group != 'passwall' }}
        uses: actions/cache@v4
        with:
          path: |
            .build/${{ matrix.id }}/sdk/dl
            .build/${{ matrix.id }}/sdk/build_dir/hostpkg
            .build/${{ matrix.id }}/sdk/staging_dir/hostpkg
            .build/${{ matrix.id }}/sdk/build_dir/target-*/host
            .build/${{ matrix.id }}/sdk/staging_dir/target-*/host
            .build/${{ matrix.id }}/sdk/tmp/go-build
          # Exclude old Rust bootstrap configs that still download CI LLVM.
          key: packages-local-llvm-v1-${{ matrix.sdk.sha256 }}-${{ matrix.group }}-${{ hashFiles('package-groups.json', 'packages-m28c.txt', 'scripts/**', 'feeds.conf.custom', 'feed-overrides.txt', 'single-packages.json') }}-${{ hashFiles(format('.build/{0}/sdk/sources.json', matrix.id)) }}
          restore-keys: |
            packages-local-llvm-v1-${{ matrix.sdk.sha256 }}-${{ matrix.group }}-
      - name: Build or fetch this software group
        env:
          BUILD_METADATA: ${{ toJSON(matrix) }}
          GROUP: ${{ matrix.group }}
          BUILD_JOBS: ${{ vars.BUILD_JOBS || '4' }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/build.json"
          bash scripts/build-packages.sh "$RUNNER_TEMP/build.json" "$GROUP"
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.id }}-${{ matrix.group }}
          path: |
            .build/${{ matrix.id }}/sdk/logs/
            .build/${{ matrix.id }}/sdk/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.id }}-${{ matrix.group }}
          path: parts/${{ matrix.id }}/${{ matrix.group }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: package-release-${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fangguangyang/openwrt-dist
          ref: master
      - name: Install index dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk libncurses-dev libssl-dev python3 rsync unzip zstd file wget
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ matrix.id }}
          path: ${{ runner.temp }}/sdk
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-${{ matrix.id }}-*
          path: parts
      - name: Merge, sign and publish the complete repository to Release
        env:
          BUILD_METADATA: ${{ toJSON(matrix) }}
          DEVICE: ${{ matrix.id }}
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          mkdir -p ".build/$DEVICE"
          tar -xf "$RUNNER_TEMP/sdk/sdk-$DEVICE.tar.zst" -C ".build/$DEVICE"
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/build.json"
          bash scripts/sign-feed.sh "$RUNNER_TEMP/build.json" parts
          bash scripts/publish-feed.sh "$RUNNER_TEMP/build.json" "repository/$DEVICE" fangguangyang/openwrt-dist
      - uses: actions/upload-artifact@v4
        with:
          name: feed-result-${{ matrix.id }}
          path: feed-results/${{ matrix.id }}.json

  results:
    needs: publish
    runs-on: ubuntu-24.04
    outputs:
      repositories: ${{ steps.collect.outputs.repositories }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-result-*
          path: feed-results
          merge-multiple: true
      - name: Collect feed Release URLs
        id: collect
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          repositories = {}
          for path in Path('feed-results').glob('*.json'):
              repositories.update(json.loads(path.read_text()))
          if not repositories:
              raise SystemExit('No package repositories were published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repositories=' + json.dumps(repositories, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published package Releases:\n\n')
              for device, url in repositories.items():
                  page = url.replace('/releases/download/', '/releases/tag/')
                  summary.write(f'- {device}: [Release]({page}) — `{url}`\n')
          PY
